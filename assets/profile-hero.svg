<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Franklin / Pesta — Full-stack engineer</title>
  <desc id="desc">Midnight blue and lime banner with an orbital code motif. Thoughtful interfaces. Powerful systems. Products that work.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151c"/><stop offset="1" stop-color="#172432"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#c6f76b"/><stop offset="1" stop-color="#74dfc0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93a7bc" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <path d="M54 58H92" stroke="#c6f76b" stroke-width="4"/>
  <text x="108" y="64" fill="#b8c7d9" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3">ENGINEERING WITH INTENTION</text>
  <text x="54" y="156" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Franklin<tspan fill="#c6f76b"> / </tspan>Pesta</text>
  <text x="58" y="201" fill="#c6f76b" font-family="Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="4">FULL-STACK ENGINEER</text>
  <text x="58" y="265" fill="#d4deeb" font-family="Segoe UI,Arial,sans-serif" font-size="27">Thoughtful interfaces. Powerful systems.</text>
  <text x="58" y="306" fill="#d4deeb" font-family="Segoe UI,Arial,sans-serif" font-size="27">Products that work.</text>
  <path d="M58 350H678" stroke="#354252"/>
  <text x="58" y="391" fill="#91a4ba" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">WEB + MOBILE</text>
  <circle cx="224" cy="386" r="3" fill="#c6f76b"/>
  <text x="246" y="391" fill="#91a4ba" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">CO-FOUNDER &amp; CTO / 49GIG</text>
  <g transform="translate(940 222)">
    <circle r="164" fill="none" stroke="#71889c" stroke-opacity=".2"/>
    <circle r="122" fill="none" stroke="#71889c" stroke-opacity=".25" stroke-dasharray="3 9"/>
    <ellipse rx="166" ry="61" transform="rotate(-38)" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <ellipse rx="166" ry="61" transform="rotate(38)" fill="none" stroke="#71889c" stroke-opacity=".5"/>
    <rect x="-73" y="-73" width="146" height="146" rx="34" fill="#192735" stroke="#50644c" transform="rotate(-9)"/>
    <text x="0" y="18" text-anchor="middle" fill="#c6f76b" font-family="Consolas,monospace" font-size="57" font-weight="700">&lt;/&gt;</text>
    <circle cx="130" cy="-103" r="8" fill="#c6f76b"/>
    <circle cx="-135" cy="97" r="5" fill="#74dfc0"/>
    <path d="M-8 -186H8M0 -194V-178M-8 186H8M0 178V194" stroke="#73879b"/>
